name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Engine, AI and API tests
    runs-on: ubuntu-latest
    # The tests connect to postgresql://localhost/wolfsheep_test as $PGUSER
    env:
      PGUSER: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wolfsheep_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  web:
    name: Web client lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
